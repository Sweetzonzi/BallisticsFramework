# 自动发布 Release
# 触发条件：
#   1. 推送 v 开头的 tag（如 v1.0.0.alpha.3）
#   2. 手动在 Actions 页面触发（workflow_dispatch）
# 多版本支持：每个 MC 版本分支独立打 tag，Release 标题会注明 MC 版本

name: 发布 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: '手动指定版本号（留空则读取 gradle.properties）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 读取 Gradle 属性
        id: props
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const props = {};
            const content = fs.readFileSync('gradle.properties', 'utf8');
            for (const line of content.split('\n')) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#')) continue;
              const eq = trimmed.indexOf('=');
              if (eq === -1) continue;
              const key = trimmed.substring(0, eq).trim();
              const val = trimmed.substring(eq + 1).trim();
              props[key] = val;
            }
            core.setOutput('mod_version', props.mod_version);
            core.setOutput('mod_id', props.mod_id);
            core.setOutput('minecraft_version', props.minecraft_version);
            core.setOutput('mod_name', props.mod_name);
            // 检测是否为 Forge 版（存在 forge_version 属性则使用 JDK 17）
            const isForge = !!props.forge_version;
            core.setOutput('is_forge', isForge ? 'true' : 'false');
            core.setOutput('java_version', isForge ? '17' : '21');

      - name: 确定发布版本号
        id: version
        shell: bash
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          MANUAL_VERSION="${{ inputs.version_override }}"
          GRADLE_VERSION="${{ steps.props.outputs.mod_version }}"

          if [ -n "$MANUAL_VERSION" ]; then
            RELEASE_VERSION="$MANUAL_VERSION"
            echo "使用手动指定的版本：$RELEASE_VERSION"
          elif [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$GITHUB_REF_NAME" ]; then
            RELEASE_VERSION="$TAG_VERSION"
            echo "使用 Tag 版本：$RELEASE_VERSION"
          else
            RELEASE_VERSION="$GRADLE_VERSION"
            echo "使用 gradle.properties 版本：$RELEASE_VERSION"
          fi

          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "发布版本号：$RELEASE_VERSION"

      - name: 验证版本号一致性
        shell: bash
        run: |
          GRADLE_VERSION="${{ steps.props.outputs.mod_version }}"
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          if [ "$GRADLE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::warning::gradle.properties 版本 ($GRADLE_VERSION) 与发布版本 ($RELEASE_VERSION) 不一致"
          fi

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java_version }}
          distribution: 'temurin'

      - name: 构建
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build

      - name: 定位 JAR 文件
        id: jar
        shell: bash
        run: |
          MOD_ID="${{ steps.props.outputs.mod_id }}"
          MC_VER="${{ steps.props.outputs.minecraft_version }}"
          JAR_PATTERN="${MOD_ID}-${MC_VER}-*.jar"
          echo "搜索产物：$JAR_PATTERN"

          JAR_FILE=$(find build/libs -name "${JAR_PATTERN}" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::找不到 JAR 产物"
            exit 1
          fi
          echo "找到产物：$JAR_FILE"
          echo "path=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename "$JAR_FILE")" >> $GITHUB_OUTPUT

      - name: 生成 Release 说明
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "上次 Tag：$PREV_TAG"
            CHANGES=$(git log --pretty=format:'- %s (%h)' $PREV_TAG..HEAD)
          else
            echo "没有历史 Tag，使用所有提交"
            CHANGES=$(git log --pretty=format:'- %s (%h)' HEAD~10..HEAD)
          fi

          # 使用随机定界符避免 heredoc 缩进问题
          DELIM=$(openssl rand -hex 8)
          {
            echo "changelog<<$DELIM"
            echo "## 此版本的变更"
            echo ""
            echo "$CHANGES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: 删除已有 Release（如果存在）
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，删除中..."
            gh release delete "$TAG" --yes
            echo "已删除旧 release"
          else
            echo "Release $TAG 不存在，无需删除"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Release 并上传 JAR
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}（Minecraft ${{ steps.props.outputs.minecraft_version }}）"
          tag_name: ${{ github.ref_name }}
          body: |
            ## ${{ steps.props.outputs.mod_name }} v${{ steps.version.outputs.version }}

            > **Minecraft ${{ steps.props.outputs.minecraft_version }}** · ${{ steps.props.outputs.is_forge == 'true' && 'Forge' || 'NeoForge' }}

            ${{ steps.changelog.outputs.changelog }}

            ---
            📖 [Wiki 文档](https://sweetzonzi.github.io/BallisticsFramework/)
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出发布摘要
        shell: bash
        run: |
          echo "============================================"
          echo "  发布完成！"
          echo "  版本：v${{ steps.version.outputs.version }}"
          echo "  MC 版本：${{ steps.props.outputs.minecraft_version }}"
          echo "  JDK 版本：${{ steps.props.outputs.java_version }}"
          echo "  产物：${{ steps.jar.outputs.name }}"
          echo "============================================"
