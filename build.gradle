plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    // Mixin 注解处理器与 jar 清单注入。Forge 1.20.1 的 MixinPlatformAgentDefault 只从
    // 清单的 MixinConfigs 属性读取配置，mods.toml 的 [[mixins]] 不会被它识别；
    // 缺此插件时 Mixin 配置不注册、注入点静默失效。
    // 0.7.38 是 org.spongepowered:mixingradle 的最新 release（该坐标的版本列表里
    // 只有 0.7.31/0.7.32/0.7.33/0.7.36/0.7.38 为非快照，其余均带 -SNAPSHOT 后缀）。
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    // MixinGradle 的发布源（0.7.38 为 release，见上方插件声明）
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

base {
    // Jar 文件名：ballistics_framework-1.20.1-forge-1.0.0.alpha.13.jar
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 生成 refmap 供生产环境（混淆名）解析注入点
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        // 无头运行 GameTest：Forge 1.20.1 的入口是 server Main 对 forge.gameTestServer
        // 属性的分支（属性为真时改构造 GameTestServer），因此沿用 server 的启动方式，
        // 只注入 gametest 相关属性。
        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.enableGameTest', 'true'
            property 'forge.gameTestServer', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// 发布产物必须自带 MixinConfigs 清单属性：MixinGradle 只为开发运行注入
// --mixin.config 参数，而 MixinPlatformAgentDefault 读取的是清单属性，
// 缺它则发布后的 jar 里 Mixin 配置不被注册、注入点静默失效。
jar {
    manifest {
        attributes(["MixinConfigs": "${mod_id}.mixins.json"])
    }
}

// 模组元数据生成，从 templates/ 展开 ${} 占位符
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

// 发布配置独立到 publish.gradle
apply from: 'publish.gradle'

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
