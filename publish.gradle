// Maven 发布配置 — 将本库发布到远程 Maven 仓库
// 敏感信息通过环境变量传入：
//   $env:BALLISTICS_MAVEN_USER = "developer"
//   $env:BALLISTICS_MAVEN_PASS = "你的密码"

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            // Maven artifactId，包含加载器和 MC 版本信息
            artifactId = "${mod_id}-${minecraft_version}-neoforge"
            // 补充 pom 信息，方便其他项目引用
            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/Sweetzonzi/BallisticsFramework'
                licenses {
                    license {
                        name = mod_license
                    }
                }
                developers {
                    developer {
                        id = 'sweetzonzi'
                        name = mod_authors
                    }
                }
                // 清空依赖列表。本库是模组兼容层，加载器与 Minecraft 的 API 由使用方
                // 自己的 mod 开发工具链提供（NeoForge/ForgeGradle 的 userdev 依赖），
                // 不能也不需要由本库传递。
                //
                // 发布配置里的 `minecraft "..."` 依赖会被 from components.java 带进
                // 元数据，而它引用的是开发用映射产物（形如
                // net.minecraftforge:forge:1.20.1-47.4.0_mapped_official_1.20.1），
                // 该版本不存在于任何公开仓库，消费方解析依赖时会直接失败。
                withXml {
                    def root = asNode()
                    root.dependencies*.replaceNode {}
                }
            }
        }
    }
    repositories {
        maven {
            // 远程 Maven 仓库地址（Nexus，发布到 maven-releases）
            // 可用仓库：maven-releases（发布版）、maven-snapshots（快照版）
            url = "https://maven.sighs.cc/repository/maven-releases/"
            credentials {
                username = System.getenv("BALLISTICS_MAVEN_USER")
                password = System.getenv("BALLISTICS_MAVEN_PASS")
            }
        }
    }
}

// Gradle 模块元数据（.module）同样会带上发布配置里的 minecraft 依赖。
// Gradle 消费方优先读 .module，只清 POM 不足以修好；本库无可传递依赖，
// 因此直接关闭 .module 的生成，让消费方回退到已清洗的 POM。
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
