// Maven 发布配置 — 将本库发布到远程 Maven 仓库
// 敏感信息通过环境变量传入：
//   $env:BALLISTICS_MAVEN_USER = "developer"
//   $env:BALLISTICS_MAVEN_PASS = "你的密码"

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            // Maven artifactId，包含加载器和 MC 版本信息
            artifactId = "${mod_id}-${minecraft_version}-neoforge"
            // 补充 pom 信息，方便其他项目引用
            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/Sweetzonzi/BallisticsFramework'
                licenses {
                    license {
                        name = mod_license
                    }
                }
                developers {
                    developer {
                        id = 'sweetzonzi'
                        name = mod_authors
                    }
                }
            }
        }
    }
    repositories {
        maven {
            // 远程 Maven 仓库地址
            url = "https://maven.sighs.cc/"
            credentials {
                username = System.getenv("BALLISTICS_MAVEN_USER")
                password = System.getenv("BALLISTICS_MAVEN_PASS")
            }
        }
    }
}
